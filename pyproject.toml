[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-animeapi"
dynamic = ["version"]
description = "AnimeAPI tool for LangChain and LangGraph agents: anime image generation at $0.003 per image."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "AnimeAPI", email = "contact@animeapi.ai" }]
keywords = ["langchain", "langgraph", "tool", "agent", "anime", "image-generation", "text-to-image", "animeapi", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["langchain-core>=0.3.0,<2", "animeapi-sdk>=0.1.2,<1"]

[project.urls]
Homepage = "https://animeapi.ai"
Documentation = "https://animeapi.ai/docs"
Repository = "https://github.com/animeapi-ai/langchain-animeapi"
Issues = "https://github.com/animeapi-ai/langchain-animeapi/issues"

[tool.hatch.version]
path = "src/langchain_animeapi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_animeapi"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
